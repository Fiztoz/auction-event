services:
  # ── Database ──────────────────────────────────────────────
  
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASSWORD:-reporting_password}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-reporting}
    volumes:
      - ./db/mariadb/init:/docker-entrypoint-initdb.d
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Event Bus ──────────────────────────────────────────────
  
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reporting Service (Ruby/Sinatra Fullstack) ──────────────
  
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reporting}
      MARIADB_USER: root
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-reporting_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RACK_ENV: development
      PORT: 4567
    ports:
      - "${PORT:-4567}:4567"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  # ── Seeder ──────────────────────────────────────────────
  
  seeder:
    build: .
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reporting}
      MARIADB_USER: root
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-reporting_password}
    command: ruby bin/seed.rb
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

volumes:
  mariadb_data:
  rabbitmq_data:
  bundle_cache:
